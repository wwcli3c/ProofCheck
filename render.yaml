# ProofCheck - FREE Render Blueprint (evaluation / demo only)
# Place this file at the root of the wwcli3c/ProofCheck repository.
# App source files are in ProofCheck_Public_Ready/.
# Free plan has no persistent disk. Sessions, evidence and share links
# may be lost after 15 min of inactivity, restarts, or redeploys.
services:
  - type: web
    name: proofcheck-public
    runtime: python
    plan: free
    region: frankfurt
    rootDir: ProofCheck_Public_Ready
    buildCommand: python -m compileall -q .
    startCommand: python server.py --mode web --port $PORT --no-browser
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: PROOFCHECK_DB
        value: /tmp/proofcheck.sqlite3
      - key: PROOFCHECK_CREATE_PER_HOUR
        value: '600'
