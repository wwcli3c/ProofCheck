# Render: New > Blueprint > select the GitHub repository containing this project.
# Paid web instance is required to attach persistent disk and avoid idle sleeping.
services:
  - type: web
    name: proofcheck-public
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: python -m compileall -q .
    startCommand: python server.py --mode web --port $PORT --no-browser
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: PROOFCHECK_DB
        value: /opt/render/project/src/data/proofcheck.sqlite3
      # On Render requests originate at its own proxy, so raise the shared limit.
      # For high public traffic, implement a proper trusted ingress/WAF limit.
      - key: PROOFCHECK_CREATE_PER_HOUR
        value: '600'
    disk:
      name: proofcheck-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 10
